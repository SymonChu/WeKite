name: CI

on:
  push:
    branches: [master, fresh-start]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, submodules: recursive }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: chmod +x gradlew
      - uses: dtolnay/rust-toolchain@nightly
        with: { targets: aarch64-linux-android,armv7-linux-androideabi }
      - name: Install NDK
        run: |
          NDK_VER=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VER"
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true, workspaces: . -> target }
      - run: sudo apt install -y gcc-multilib
      - run: cargo xtask configure && cargo xtask build --native-only
      - run: ./gradlew assembleStandardDebug
      - run: mkdir -p dist/apk && cp app/build/outputs/apk/standard/debug/app-standard-debug.apk dist/apk/WeLite-debug.apk
      - uses: actions/upload-artifact@v7
        with: { name: welite-apk, path: dist/apk/*.apk }
