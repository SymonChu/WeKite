name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VER=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - run: sudo apt install -y gcc-multilib

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Build APK
        run: ./gradlew assembleStandardDebug --warning-mode all

      - name: Upload APK as Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find app/build/outputs -name '*.apk' | head -1 | while read apk; do
            echo "Found APK: $apk"
            echo "APK_PATH=$apk" >> $GITHUB_ENV
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete CI --yes --repo ${{ github.repository }} 2>/dev/null || true
          gh release create CI --title "CI Build" --notes "Auto-built WeLite APK" --repo ${{ github.repository }}
          gh release upload CI "${{ env.APK_PATH }}" --repo ${{ github.repository }} --clobber
