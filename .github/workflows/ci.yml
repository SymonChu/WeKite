name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VER=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - run: |
          sudo apt-get update
          sudo apt install -y gcc-multilib || echo "gcc-multilib 安装失败但不影响编译"

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Setup signing keystore
        run: |
          if [ -n "${{ secrets.WEKITE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.WEKITE_KEYSTORE_B64 }}" | base64 -d > wekite-release.jks
            echo "keystore ready: $(stat -c%s wekite-release.jks) bytes"
          else
            echo "no keystore secret, using debug signing"
          fi

      - name: Build APK
        run: ./gradlew assembleStandardRelease --warning-mode all --rerun-tasks
        env:
          WEKIT_KEYSTORE_FILE: ${{ github.workspace }}/wekite-release.jks
          WEKIT_KEYSTORE_PASSWORD: ${{ secrets.WEKITE_KEYSTORE_PASSWORD }}
          WEKIT_KEY_ALIAS: ${{ secrets.WEKITE_KEY_ALIAS }}
          WEKIT_KEY_PASSWORD: ${{ secrets.WEKITE_KEY_PASSWORD }}

      - name: Verify DEX class names survive R8 (keepRules)
        run: |
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          python3 - "$APK" <<'EOF'
          import zipfile, sys
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          dex_all = b""
          for name in z.namelist():
              if name.startswith('classes') and name.endswith('.dex'):
                  dex_all += z.read(name)
          # IResolveDex 实现类必须全部保留原始类名（keepRules 生效的证明）
          required = [b'ReplaceNavigationBar', b'ApplyDialogBackgroundBlur',
                      b'WeMainActivityBeautifyApi', b'WeChatMessageViewApi',
                      b'WeDatabaseApi', b'MonetEngine', b'AutoCacheImages']
          missing = [c.decode() for c in required if c not in dex_all]
          if missing:
              print("FAIL: keepRules/rules.keep broken — missing from DEX:", missing)
              sys.exit(1)
          print("OK: all IResolveDex class names preserved in DEX")
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wekite-apk
          path: app/build/outputs/**/*.apk

  build_zygisk:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/armv7a-linux-androideabi$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Download Release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wekite-apk
          path: artifacts

      - name: Build Zygisk module
        run: |
          APK_PATH=$(find artifacts -name "app-standard-release.apk" | head -1)
          echo "APK: $APK_PATH"
          test -n "$APK_PATH"
          ./x zygisk build --apk-release --release --skip-apk-build \
            --apk "$APK_PATH"

      - name: Upload Zygisk module
        uses: actions/upload-artifact@v7
        with:
          name: wekite-zygisk
          path: wekit-zygisk/release/*.zip
          if-no-files-found: error
